name = "island-room"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 무료 플랜에서는 SQLite 방식 Durable Object 만 쓸 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# 이 주소들에서 연 게임만 방에 들어올 수 있다 (*.도메인 = 하위 주소 모두, 예: Pages 미리보기 배포)
ALLOWED_ORIGINS = "https://island-8pt.pages.dev,*.island-8pt.pages.dev,http://localhost:5190,http://127.0.0.1:5190"
